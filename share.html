<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Harm | Parivaar Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --paper: #F4F1EA;
            --ink: #1A1A1A;
            --blue: #3D5A80;
            --border: rgba(26, 26, 26, 0.2);
        }

        /* STICKY FOOTER FIX */
        html, body { height: 100%; margin: 0; }
        body { 
            display: flex; flex-direction: column;
            font-family: 'Inter', sans-serif; 
            background-color: var(--paper); 
            color: var(--ink); 
            line-height: 1.6; 
        }
        .content-wrapper { flex: 1 0 auto; }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        header {
            background: var(--paper); border-bottom: 2px solid var(--ink);
            padding: 1.2rem 8%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2000;
        }
        .logo { font-size: 2.2rem; font-weight: 900; color: var(--ink); text-decoration: none; letter-spacing: -2px; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--ink); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }

        /* HAMBURGER BUTTON STYLE */
        .menu-toggle { display: none; background: none; border: none; cursor: pointer; color: var(--ink); padding: 5px; z-index: 2100; }

        .form-section { padding: 6rem 8%; max-width: 900px; margin: 0 auto; }
        .section-label { font-size: 0.7rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 1rem; display: block; color: var(--blue); }
        h1 { font-family: 'Lora', serif; font-size: 3.5rem; margin: 0 0 3rem 0; line-height: 1; letter-spacing: -2px; }

        form { display: grid; gap: 2.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.8rem; position: relative; }
        label { font-weight: 900; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        
        .ai-btn { 
            background: var(--blue); color: white; border: none; padding: 6px 12px; 
            font-size: 0.65rem; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 5px;
            font-family: 'Inter', sans-serif; font-weight: 800;
        }
        .ai-btn:hover { background: var(--ink); }
        .ai-btn:disabled { background: #ccc; cursor: not-allowed; }

        input, textarea, select {
            background: transparent; border: none; border-bottom: 2px solid var(--border);
            padding: 1rem 0; font-family: 'Lora', serif; font-size: 1.2rem; color: var(--ink); outline: none;
        }
        input:focus, textarea:focus { border-bottom-color: var(--ink); }
        textarea { min-height: 150px; resize: vertical; }

        #customCategory {
            margin-top: 10px;
            font-size: 1rem;
            border-bottom: 2px solid var(--blue);
            display: none; 
        }

        .toggle-container { display: flex; align-items: center; gap: 1rem; cursor: pointer; }
        .toggle-box { width: 50px; height: 26px; background: #ccc; border-radius: 50px; position: relative; }
        .toggle-box::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.3s; }
        #anonymousCheck:checked + .toggle-box { background: var(--ink); }
        #anonymousCheck:checked + .toggle-box::after { left: 27px; }
        #anonymousCheck { display: none; }

        .btn-submit {
            background: var(--ink); color: var(--paper); border: none;
            padding: 1.5rem; font-weight: 900; font-size: 1rem; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; margin-top: 2rem;
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--paper); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }

        footer { 
            flex-shrink: 0;
            background: var(--paper); padding: 5rem 8% 4rem; border-top: 2px solid var(--ink); text-align: center; 
        }
        .footer-logo { font-size: 1.8rem; font-weight: 900; margin-bottom: 1.5rem; }
        .made-by { font-weight: 900; font-size: 1.1rem; margin-bottom: 1.5rem; }
        .heart { color: var(--ink); display: inline-block; animation: pump 1.2s infinite; font-size: 1.4rem; }
        .social-icons { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.5rem; }
        .social-icons a { color: var(--ink); }

        @keyframes pump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

        /* RESPONSIVE MOBILE NAV */
        @media (max-width: 768px) {
            header { padding: 1rem 5%; }
            .menu-toggle { display: block; }
            
            .nav-links {
                position: fixed; 
                top: 72px; 
                left: 0; 
                width: 100%; 
                background: var(--paper);
                flex-direction: column; 
                padding: 1rem 0; 
                border-bottom: 2px solid var(--ink);
                transform: translateY(-150%); 
                transition: transform 0.4s ease-in-out; 
                z-index: 1999;
                gap: 0;
                visibility: hidden; /* Safety against ghost clicks */
            }
            .nav-links.active { 
                transform: translateY(0); 
                visibility: visible;
            }
            .nav-links a { 
                width: 100%; 
                text-align: center; 
                padding: 1.5rem; 
                border-bottom: 1px solid rgba(0,0,0,0.05); 
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div id="authOverlay">
            <h2 style="font-family: 'Lora', serif; font-size: 2rem;">Archive Access Required</h2>
            <p>You must be signed in to contribute to the collective memory.</p>
            <a href="login.html" class="btn-submit" style="text-decoration: none; padding: 1rem 2rem;">Go to Login</a>
        </div>

        <header>
            <a href="index.html" class="logo">परिवार</a>
            
            <button class="menu-toggle" id="menuToggle">
                <i data-lucide="menu"></i>
            </button>

            <nav class="nav-links" id="navLinks">
                <a href="index.html">Archives</a>
                <a href="share.html">Document</a>
                <a href="profile.html">Records</a>
            </nav>
        </header>

        <main class="form-section">
            <span class="section-label">Submission Portal</span>
            <h1>File a Record</h1>
            
            <form id="insightForm">
                <div class="input-group">
                    <label>Archive Category</label>
                    <select id="category" required onchange="checkCategory(this.value)">
                        <option value="Social Malpractice">Social Malpractice</option>
                        <option value="Female Foeticide">Female Foeticide Prevention</option>
                        <option value="Dowry/Domestic Rights">Dowry & Domestic Rights</option>
                        <option value="Girls Education">Girls' Education & Empowerment</option>
                        <option value="LGBTQ+ Safety">LGBTQ+ Safety & Inclusion</option>
                        <option value="Systemic Injustice">Systemic Injustice</option>
                        <option value="Other">Other (Write your own...)</option>
                    </select>
                    <input type="text" id="customCategory" placeholder="Enter custom category name...">
                </div>

                <div class="input-group">
                    <label>Headline</label>
                    <input type="text" id="title" placeholder="Summary of experience" required>
                </div>

                <div class="input-group">
                    <label>The Narrative</label>
                    <textarea id="content" placeholder="Document the structural patterns..." required></textarea>
                </div>

                <div class="input-group">
                    <label>
                        The Prevention Nugget
                        <button type="button" class="ai-btn" id="aiGenBtn">
                            <i data-lucide="sparkles" style="width:12px"></i> AI ASSIST
                        </button>
                    </label>
                    <textarea id="prevention" placeholder="Specific red flag for others..." required></textarea>
                </div>

                <label class="toggle-container">
                    <input type="checkbox" id="anonymousCheck">
                    <div class="toggle-box"></div>
                    <span style="font-weight: 800; font-size: 0.8rem; text-transform: uppercase;">Stay Anonymous</span>
                </label>

                <button type="submit" class="btn-submit" id="submitBtn">File to Archive</button>
            </form>
        </main>
    </div>

    <footer>
        <div class="footer-logo">परिवार</div>
        <div class="made-by">Made with <span class="heart">♡</span> by Sanidhya</div>
        <div class="social-icons">
            <a href="https://github.com/sanidhya2506"><i data-lucide="github"></i></a>
            <a href="https://www.linkedin.com/in/sanidhya-sharma-22ba91237/"><i data-lucide="linkedin"></i></a>
        </div>
        <p style="font-size: 0.7rem; margin-top: 2.5rem; opacity: 0.5; letter-spacing: 1px;">&copy; 2026 ARCHIVE PROJECT</p>
    </footer>

    <script>
        function checkCategory(val) {
            const customInput = document.getElementById('customCategory');
            if(val === 'Other') {
                customInput.style.display = 'block';
                customInput.required = true;
            } else {
                customInput.style.display = 'none';
                customInput.required = false;
            }
        }
    </script>

    <script type="module">
        import { HF_TOKEN } from './secrets.js';
        import { db, auth } from './firebase-config.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

        lucide.createIcons();

        // --- UNIFIED HAMBURGER LOGIC ---
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            const isActive = navLinks.classList.toggle('active');
            const icon = menuToggle.querySelector('i');
            icon.setAttribute('data-lucide', isActive ? 'x' : 'menu');
            lucide.createIcons();
        });

        // --- AI ASSIST LOGIC ---
        const aiBtn = document.getElementById('aiGenBtn');
        const preventionBox = document.getElementById('prevention');

        aiBtn.addEventListener('click', async function handleAI() {
            const narrative = document.getElementById('content').value;
            if(!narrative || narrative.length < 10) {
                alert("Please write a narrative first (at least 10 characters).");
                return;
            }

            aiBtn.disabled = true;
            aiBtn.innerText = "✨ THINKING...";

            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2",
                    {
                        headers: { 
                            Authorization: `Bearer ${HF_TOKEN}`,
                            "Content-Type": "application/json",
                        },
                        method: "POST",
                        body: JSON.stringify({
                            inputs: `<s>[INST] Summarize this story into a 2-sentence warning or red flag for a social archive. Return ONLY the 2 sentences. Story: ${narrative} [/INST]`,
                            parameters: { 
                                max_new_tokens: 100,
                                return_full_text: false 
                            }
                        }),
                    }
                );

                const result = await response.json();
                
                if (result.error && result.error.includes("loading")) {
                    aiBtn.innerText = "⏳ WAKING UP AI...";
                    setTimeout(() => handleAI(), 3000); 
                    return;
                }

                if (result[0] && result[0].generated_text) {
                    let nugget = result[0].generated_text.replace(/\[\/INST\]/g, "").trim();
                    preventionBox.value = nugget;
                }
            } catch (error) {
                console.error("AI Error:", error);
                alert("AI connection failed.");
            } finally {
                aiBtn.disabled = false;
                aiBtn.innerHTML = `<i data-lucide="sparkles" style="width:12px"></i> AI ASSIST`;
                lucide.createIcons();
            }
        });

        // --- FIREBASE SUBMISSION LOGIC ---
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        const form = document.getElementById('insightForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "ARCHIVING...";

            let selectedCategory = document.getElementById('category').value;
            if(selectedCategory === 'Other') {
                selectedCategory = document.getElementById('customCategory').value;
            }

            const entryData = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                prevention: document.getElementById('prevention').value,
                category: selectedCategory,
                isAnonymous: document.getElementById('anonymousCheck').checked,
                userId: user.uid,
                authorName: user.displayName || "Witness",
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "insights"), entryData);
                alert("Successfully archived.");
                window.location.href = "profile.html";
            } catch (error) {
                alert("Error: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "File to Archive";
            }
        });
    </script>
</body>
</html>
